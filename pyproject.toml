[project]
name = "vol-desk-agent"
version = "0.1.0"
description = "Vol Desk: an options & volatility agent (FastAPI + LiteLLM + Gemini) with live Cboe data and Black-Scholes tools"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "litellm>=1.50",
    "google-cloud-aiplatform>=1.40.0",
    "requests>=2.31",
    "tzdata>=2026.5",
]
